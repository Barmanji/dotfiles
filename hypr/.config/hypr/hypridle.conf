general {
    # 1. Stop timer BEFORE locking so it doesn't hang until you unlock
    lock_cmd = $HOME/scripts/study_timer/test.sh stop; hyprlock

    # 2. Stop timer before the system goes to sleep
    before_sleep_cmd = $HOME/scripts/study_timer/test.sh stop

    # 3. Turn monitor back on after waking up
    after_sleep_cmd = hyprctl dispatch dpms on
}

# --- 60 Second Idle (AFK) ---
# Stops the timer if you walk away but don't lock the PC
listener {
    timeout = 150
    on-timeout = $HOME/scripts/study_timer/test.sh stop
}

# --- 10 Minute Idle (Security) ---
# Triggers the system lock (which calls your lock_cmd above)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# --- 15 Minute Idle (Power Save) ---
# Turns off the screen pixels
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# --- THE AUTO-RESTART ---
# This restarts the background listener script as soon as you are active again
listener {
    timeout = 2
    on-resume = $HOME/scripts/study_timer/test.sh &
}
